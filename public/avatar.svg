<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900">
<defs>
  <radialGradient id="bg" cx="50%" cy="28%" r="75%"><stop offset="0" stop-color="#182035"/><stop offset=".55" stop-color="#090b14"/><stop offset="1" stop-color="#020307"/></radialGradient>
  <linearGradient id="hair" x1="0" x2="1"><stop stop-color="#07070b"/><stop offset=".48" stop-color="#24202c"/><stop offset="1" stop-color="#050509"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe8e1"/><stop offset="1" stop-color="#e9b7b0"/></linearGradient>
  <linearGradient id="jacket" x1="0" x2="1"><stop stop-color="#080910"/><stop offset=".5" stop-color="#1c1b28"/><stop offset="1" stop-color="#07080e"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="800" height="900" fill="url(#bg)"/>
<ellipse cx="400" cy="790" rx="250" ry="42" fill="#000" opacity=".55" filter="url(#glow)"/>

<!-- long hair -->
<path d="M164 430Q112 150 400 88Q688 150 636 430L700 760Q646 830 566 770L514 560L286 560L234 770Q154 830 100 760Z" fill="url(#hair)" stroke="#4a4050" stroke-width="5"/>
