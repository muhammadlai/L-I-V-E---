<path d="M315 615Q400 670 485 615" fill="none" stroke="#7b6c8e" stroke-width="3"/>

<!-- necklace -->
<path d="M348 570Q400 620 452 570" fill="none" stroke="#d7c1d5" stroke-width="4"/>
<circle cx="400" cy="620" r="10" fill="#9b79c7" stroke="#f0dff0" stroke-width="3"/>

<!-- crossed arms / gentle gesture -->
<path d="M235 700Q320 650 405 735Q470 800 548 720" fill="none" stroke="#e8b8b1" stroke-width="58" stroke-linecap="round"/>
<path d="M238 700Q320 650 405 735" fill="none" stroke="#1b1b25" stroke-width="72" stroke-linecap="round" opacity=".95"/>
<path d="M562 720Q490 670 400 735" fill="none" stroke="#1b1b25" stroke-width="72" stroke-linecap="round" opacity=".95"/>
<path d="M235 700Q320 650 405 735" fill="none" stroke="#e8b8b1" stroke-width="32" stroke-linecap="round"/>
<path d="M565 720Q492 670 400 735" fill="none" stroke="#e8b8b1" stroke-width="32" stroke-linecap="round">
 <animateTransform attributeName="transform" type="rotate" values="0 565 720;3 565 720;0 565 720;-2 565 720;0 565 720" dur="3.8s" repeatCount="indefinite"/>
</path>

<!-- earrings -->
<circle cx="246" cy="418" r="10" fill="#d9b7ef"/><circle cx="554" cy="418" r="10" fill="#d9b7ef"/>

<!-- subtle breathing / body motion -->
<g>
 <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0;0 2;0 0" dur="3.4s" repeatCount="indefinite"/>
</g>
<text x="400" y="858" text-anchor="middle" fill="#d8d3df" opacity=".72" font-family="Inter,Arial,sans-serif" font-size="20" letter-spacing="4">SARA AI</text>
</svg>