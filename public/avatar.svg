<!-- face -->
<path d="M238 250Q400 170 562 250L548 438Q530 548 400 590Q270 548 252 438Z" fill="url(#skin)" stroke="#d7a6a0" stroke-width="3"/>

<!-- front hair -->
<path d="M220 330Q210 170 300 128Q370 105 400 140Q360 245 305 330Q270 372 220 330Z" fill="url(#hair)"/>
<path d="M580 330Q590 170 500 128Q430 105 400 140Q440 245 495 330Q530 372 580 330Z" fill="url(#hair)"/>
<path d="M325 145Q400 105 475 145Q454 215 400 260Q346 215 325 145Z" fill="#111019"/>

<!-- eyes -->
