 <path d="M285 365Q325 332 365 365Q330 404 285 365Z" fill="#fff"/>
 <path d="M435 365Q475 332 515 365Q470 404 435 365Z" fill="#fff"/>
 <ellipse cx="331" cy="369" rx="17" ry="23" fill="#4b3c78"/>
 <ellipse cx="469" cy="369" rx="17" ry="23" fill="#4b3c78"/>
 <circle cx="334" cy="365" r="7" fill="#fff"/>
 <circle cx="472" cy="365" r="7" fill="#fff"/>
 <path d="M283 348Q326 316 369 344" fill="none" stroke="#16131b" stroke-width="10" stroke-linecap="round"/>
 <path d="M431 344Q474 316 517 348" fill="none" stroke="#16131b" stroke-width="10" stroke-linecap="round"/>
 <path d="M283 365Q325 414 369 365" fill="none" stroke="#17131d" stroke-width="5">
   <animate attributeName="d" values="M283 365Q325 414 369 365;M283 365Q325 365 369 365;M283 365Q325 414 369 365" dur="4.6s" repeatCount="indefinite"/>
 </path>
 <path d="M431 365Q475 414 517 365" fill="none" stroke="#17131d" stroke-width="5">
   <animate attributeName="d" values="M431 365Q475 414 517 365;M431 365Q475 365 517 365;M431 365Q475 414 517 365" dur="4.6s" repeatCount="indefinite"/>
 </path>
</g>

<!-- nose + talking mouth -->
<path d="M400 382Q382 440 400 448Q418 440 400 382" fill="none" stroke="#c98e8d" stroke-width="5" stroke-linecap="round"/>
<path d="M355 470Q400 492 445 470Q434 520 400 523Q366 520 355 470Z" fill="#8f465c">
 <animate attributeName="d" values="M355 470Q400 492 445 470Q434 520 400 523Q366 520 355 470Z;M360 478Q400 478 440 478Q430 495 400 497Q370 495 360 478Z;M355 470Q400 492 445 470Q434 520 400 523Q366 520 355 470Z" dur=".72s" repeatCount="indefinite"/>
</path>
<path d="M372 486Q400 500 428 486" fill="none" stroke="#f7b3bd" stroke-width="5" stroke-linecap="round"/>

<!-- neck -->
<path d="M348 530L348 620Q400 652 452 620L452 530Z" fill="url(#skin)"/>

<!-- blouse and jacket -->
<path d="M270 590Q400 548 530 590L630 900H170Z" fill="url(#jacket)" stroke="#3a3747" stroke-width="5"/>
<path d="M330 590L400 700L470 590L438 560H362Z" fill="#f4eef1"/>
